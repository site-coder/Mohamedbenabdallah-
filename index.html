<style>
:root{--bg:#08070C;--card:rgba(20,16,32,.62);--line:rgba(168,85,247,.22);--text:#fff;--muted:#B7AFCB;--p:#A855F7;--p2:#C084FC;--g:#F59E0B;--glow:0 0 22px rgba(192,132,252,.55),0 0 60px rgba(168,85,247,.3);--wave:.55;--r:16px}
:root[data-theme="light"]{--bg:#F7F3FF;--card:rgba(255,255,255,.75);--line:rgba(126,34,206,.22);--text:#1A1030;--muted:#5E5378;--p:#7E22CE;--p2:#9333EA;--g:#D97706;--glow:0 0 18px rgba(168,85,247,.28);--wave:.2}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Alexandria',sans-serif;background:var(--bg);color:var(--text);line-height:1.9;font-size:16px;min-height:100vh;padding-top:env(safe-area-inset-top,0px);transition:background .3s,color .3s}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.waves{position:fixed;inset:0;z-index:-1;opacity:var(--wave);pointer-events:none}
.waves svg{width:100%;height:100%}
.wrap{width:min(1040px,100% - 32px);margin-inline:auto}

header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;min-height:68px;padding:8px 0}
.brand{grid-column:2;text-align:center}
.name{display:inline-flex;flex-direction:column;align-items:center;direction:ltr;font-weight:800;font-size:clamp(17px,4.8vw,24px);line-height:.95;text-shadow:0 0 18px rgba(192,132,252,.7),0 0 42px rgba(168,85,247,.4)}
.name span{display:block;white-space:nowrap}
.aff{margin-top:5px;font-weight:300;font-size:clamp(10.5px,2.9vw,13px);line-height:1.55;color:#D8C7FF;letter-spacing:.2px}
.aff span{display:block}
:root[data-theme="light"] .aff{color:var(--p)}
.toggle{grid-column:3;justify-self:end;width:54px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--card);position:relative;cursor:pointer}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--g),#FCD34D);transition:transform .3s;box-shadow:0 0 12px rgba(245,158,11,.6)}
:root[data-theme="dark"] .toggle::after{transform:translateX(-24px);background:linear-gradient(135deg,var(--p2),var(--p));box-shadow:0 0 12px rgba(168,85,247,.7)}

.hero{text-align:center;padding:64px 0 36px}
h1{font-size:clamp(34px,9vw,68px);font-weight:800;line-height:1.35;text-shadow:var(--glow)}
.lead{color:var(--muted);font-weight:300;font-size:clamp(16px,4vw,20px);max-width:34em;margin:20px auto 0}
.lead b{color:var(--g);font-weight:600}

.grid{display:grid;grid-template-columns:1fr;gap:16px;padding:20px 0 64px}
.card{display:block;width:100%;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.card img{display:block;width:100%;height:auto}
.card:hover{transform:translateY(-4px);border-color:var(--p2);box-shadow:0 0 30px rgba(168,85,247,.4)}
@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}

.back{margin:22px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 18px;font-size:14px;color:var(--p2);cursor:pointer}
.list{display:grid;gap:12px;padding:16px 0 64px;max-width:560px;margin-inline:auto}
.lec{display:block;width:100%;text-align:center;font-size:18px;font-weight:600;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.2s}
.lec:hover{border-color:var(--g);box-shadow:0 0 24px rgba(245,158,11,.3)}
.ptitle{text-align:center;font-size:clamp(24px,6vw,34px);font-weight:800;text-shadow:var(--glow);margin:8px 0 12px}

.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 16px}
.tabs button{padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-size:14px;transition:.2s}
.tabs button[aria-selected="true"]{border-color:var(--g);color:var(--g);box-shadow:0 0 18px rgba(245,158,11,.3)}
@media(min-width:700px){.tabs{grid-template-columns:repeat(4,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 22px;margin-bottom:64px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel h3{color:var(--g);font-size:20px;font-weight:600;margin:18px 0 6px}
.panel h3:first-child{margin-top:0}
.panel p{color:var(--muted);font-weight:300;max-width:64ch;margin-bottom:12px}
.panel li{color:var(--muted);font-weight:300;margin:0 20px 8px}
.dl{display:inline-block;margin-top:14px;padding:12px 28px;border:1px solid var(--g);border-radius:12px;color:var(--g);text-decoration:none;transition:.2s}
.dl:hover{background:var(--g);color:#1A1030}
.tabs.five button:last-child{grid-column:1/-1}
@media(min-width:700px){.tabs.five{grid-template-columns:repeat(5,1fr)}.tabs.five button:last-child{grid-column:auto}}
button.dl{background:transparent;cursor:pointer;font:inherit;margin-inline-end:10px}
.map{display:block;width:100%;max-width:760px;margin:0 auto 6px;border-radius:12px;background:#fff}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0}
.q{margin-bottom:22px}.q b{display:block;margin-bottom:8px;font-weight:600}
.opt{display:block;width:100%;text-align:start;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--p2)}
.opt.ok{border-color:#34D399;background:rgba(52,211,153,.15)}.opt.no{border-color:#F87171;background:rgba(248,113,113,.15)}
.score{text-align:center;color:var(--g);font-weight:600;min-height:1.9em}
footer{border-top:1px solid var(--line);text-align:center;padding:40px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.fnote{color:var(--muted);font-weight:300;font-size:clamp(15px,4vw,18px)}
.bye{margin-top:6px;font-weight:800;font-size:clamp(46px,14vw,92px);line-height:1.3;color:var(--g);text-shadow:0 0 24px rgba(245,158,11,.55),0 0 60px rgba(168,85,247,.35)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* رابط ملف PDF لكل محاضرة: غيّره إلى مساراتك الفعلية */
function pdfUrl(s,l){return 'pdf/subject'+(s+1)+'-lecture'+l+'.pdf'}

  ['مقدمة','يقدّم هذا الدرس نظرة عامة على المفاهيم الأساسية، ويمهّد لفهم الموضوعات اللاحقة بأسلوب واضح ومنظم. هذا نص تجريبي يمكن استبداله بمحتوى الدرس الفعلي.'],

var FAQ=[['ما الفكرة الرئيسية لهذه المحاضرة؟','عرض المفاهيم الأساسية وربطها بالتطبيق العملي.'],['كيف أستعد للامتحان في هذه المحاضرة؟','اقرأ الدرس، راجع الملخص، ثم أجب عن أسئلة الاختيار من متعدد.'],['ماذا أفعل إذا لم أفهم نقطة ما؟','أعد قراءة الفقرة المعنية، ودوّن سؤالك لتناقشه لاحقًا.']];

];
/* محتوى كل محاضرة: المفتاح = رقم المادة-رقم المحاضرة (مثال "1-1") */
var CONTENT={"5-1": {"lesson": [["مقدمة", "الطب الرياضي هو أحد التخصصات الطبية الحديثة، وفيه يُهتم برجوع المصاب أو الرياضي بعد مرضه أو إصابته إلى حد لياقته البدنية العادية. وفيه يتم تحسين القوى الجسدية المحتومة على النشاط البدني."], ["", "ويهتم الطب الرياضي ببحث وعلاج التغيرات الفسيولوجية والمورفولوجية والشريحية المرضية في جسم الإنسان نتيجة الجهد البدني في الظروف العادية والمختلفة، ويبحث العلاقات التطبيقية."], ["هدف الاختيار والتوجيه والمراقبة وملاحظة الرياضي", "مراقبة تأثير الرياضة على جسم الإنسان (جهاز اللياقة البدنية)."], ["تاريخ الطب الرياضي", ["<b>1896 م:</b> استُخدم هذا المصطلح لأول مرة خلال الألعاب الأولمبية في أثينا (اليونان) من خلال تطبيق بعض العلاجات الطبية على الرياضيين.", "<b>1913:</b> تحوّل خلال يوم طبي دراسي إلى فرع من فروع الطب، وتم تأهيل بعض الأطباء وتدريبهم على هذا الفرع.", "<b>1920:</b> تم إنشاء المعهد الرياضي الطبي خلال الألعاب الأولمبية الشتوية.", "<b>1928:</b> تم إقامة المؤتمر العام الأول للطب الرياضي في هولندا (أمستردام)."]], ["أهداف الطب الرياضي", "دور الطب الرياضي في الاختيار والتوجيه والمراقبة والعلاج. وحسب <b>Bent CARLLY</b> فإن الطب الرياضي يعمل على:"], ["", ["<b>الاختيار:</b> يختار الطب الرياضي الفرد الذي يستطيع ممارسة الرياضة من عدمها، وذلك من خلال تشخيص الأمراض التي تمنعه من ذلك.", "<b>التوجيه:</b> يقدم مجموعة من الفحوص الطبية والاختبارات والتمارين، ومن خلال النتائج ينصح الرياضي ويوجهه إلى ألعاب معينة (حسب البنية الجسدية، والقدرة البدنية، والوضعية، والإمكانيات المورفولوجية).", "<b>المراقبة:</b> فحص ومتابعة الرياضي بصفة مستمرة لتجنب الإصابات الرياضية.", "<b>العلاج:</b> علاج الإصابات (علاجات مختلفة وإعادة التأهيل)."]], ["أهمية ودور الطب الرياضي", ["تحسين الأداء البدني للرياضي.", "الوقاية من الإصابات (تحديد عوامل الخطر، برنامج الإحماء).", "العلاج والتأهيل.", "تعزيز الصحة العامة للرياضي."]], ["أقسام الطب الرياضي", ["<b>الطب الرياضي التوجيهي:</b> يتم توجيه الفرد انطلاقًا من الاختبارات والفحوص التشريحية والمورفولوجية والفيزيولوجية والسيكولوجية بما يناسب وإمكانياتهم.", "<b>الطب الرياضي الوقائي:</b> يقوم بالدراسة والبحث في مختلف التغيرات الفيزيولوجية والشريحية والنفسية والحيوية في جسم الرياضي وحالته الحركية البدنية والنفسية خارج وداخل الملعب. ويمكن للطب الرياضي أن يصدر بعض التعليمات إلى المدرب من خلال النصح ببعض التمارين الرياضية التعويضية.", "<b>الطب الرياضي العلاجي:</b> علاج الإصابات (الجراحة، التأهيل الطبي الصحي، الأخصائيين).", "<b>الطب الرياضي التأهيلي:</b> تحديد برنامج تدريبي للمصاب ومدة الشفاء للسماح للرياضي بالعودة إلى المنافسة في أحسن الظروف."]], ["تعريف الطب الرياضي", "الطب الرياضي هو طب مختص في الوقاية من الإصابات الرياضية وعلاجها وتحسين الأداء، كما يقوم بفحص ومتابعة الرياضي."], ["مهامه", ["التشخيص والعلاج.", "الوقاية والإرشاد.", "إعادة التأهيل."]]], "summary": [{"h": "مفهوم الطب الرياضي ومهامه", "l": ["تخصص طبي حديث يهتم بعودة المصاب أو الرياضي إلى لياقته العادية، ويبحث التغيرات الفسيولوجية والمورفولوجية والشريحية المرضية الناتجة عن الجهد البدني.", "هو طب مختص في الوقاية من الإصابات وعلاجها وتحسين الأداء.", "المهام: التشخيص والعلاج، الوقاية والإرشاد، إعادة التأهيل."]}, {"h": "تاريخه", "l": ["1896: أول استخدام للمصطلح في أولمبياد أثينا. 1913: تحول إلى فرع طبي مع تأهيل الأطباء. 1920: إنشاء المعهد الرياضي الطبي (الألعاب الشتوية). 1928: أول مؤتمر عام في أمستردام."]}, {"h": "أهدافه (Bent CARLLY)", "l": ["<b>الاختيار:</b> تشخيص الأمراض لتحديد من يستطيع ممارسة الرياضة.", "<b>التوجيه:</b> فحوص واختبارات لتوجيه الرياضي إلى الألعاب المناسبة بحسب بنيته وقدرته.", "<b>المراقبة:</b> متابعة مستمرة لتجنب الإصابات. <b>العلاج:</b> علاج الإصابات وإعادة التأهيل."]}, {"h": "أهميته وأقسامه", "l": ["الأهمية: تحسين الأداء، الوقاية، العلاج والتأهيل، تعزيز الصحة العامة.", "<b>التوجيهي:</b> توجيه الفرد بحسب الفحوص. <b>الوقائي:</b> دراسة التغيرات داخل الملعب وخارجه ونصح المدرب بتمارين تعويضية. <b>العلاجي:</b> الجراحة والتأهيل الطبي والأخصائيون. <b>التأهيلي:</b> برنامج تدريبي ومدة شفاء للعودة إلى المنافسة."]}], "faq": [["الأسئلة المباشرة"], ["عرّف الطب الرياضي.", "هو طب مختص في الوقاية من الإصابات الرياضية وعلاجها وتحسين الأداء، كما يقوم بفحص ومتابعة الرياضي."], ["ما مهام الطب الرياضي؟", "التشخيص والعلاج، والوقاية والإرشاد (function(){

    }
  }
  document.querySelector('.tabs').onclick=function(e){var b=e.target.closest('button');if(b)tab(b.dataset.t)};

  /* Make both name lines equal in width using letter-spacing on the narrower one */
  function fitName(){
    var a=$('fn'),b=$('ln');
    [a,b].forEach(function(x){x.style.letterSpacing='0';x.style.transform='none'});
    var d=b.getBoundingClientRect().width-a.getBoundingClientRect().width,t=d>0?a:b,n=t.textContent.length;
    if(d!==0){var ls=Math.abs(d)/n;t.style.letterSpacing=ls+'px';t.style.transform='translateX('+(ls/2)+'px)'}
  }
  fitName();addEventListener('resize',fitName);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitName);
})();
</script>
</body>
